<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aetiss</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 56px);
      text-align: center;
      padding: 2rem;
      gap: 1rem;
    }
    .hero-tag {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    .hero h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--fg);
    }
    .hero-sub {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 440px;
      line-height: 1.6;
    }
    .hero-links {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .hero-link {
      font-family: var(--mono);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.65rem 1.75rem;
      border-radius: 4px;
      text-decoration: none;
      transition: all 0.15s;
    }
    .hero-link.primary {
      background: var(--fg);
      color: var(--bg);
    }
    .hero-link.primary:hover {
      background: var(--accent);
      color: #fff;
      text-decoration: none;
    }
    .hero-link.secondary {
      border: 1px solid var(--nav-border);
      color: var(--muted);
    }
    .hero-link.secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
      text-decoration: none;
    }
    .wasm-badge {
      margin-top: 3rem;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .wasm-badge span {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #654ff0;
      box-shadow: 0 0 8px #654ff088;
    }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a href="index.html" class="nav-logo">aetiss</a>
    <div class="nav-links">
      <a href="blog.html">Blog</a>
      <a href="games.html">Games</a>
      <button id="theme-toggle" aria-label="Toggle theme">☀️</button>
    </div>
  </nav>

  <section class="hero">
    <p class="hero-tag">C / WebAssembly</p>
    <h1>aetiss</h1>
    <p class="hero-sub">
      A personal site built entirely in C, compiled to WebAssembly.
      Blog posts rendered by a C engine. Games written in C with SDL2.
    </p>
    <div class="hero-links">
      <a href="blog.html" class="hero-link primary">Blog</a>
      <a href="games.html" class="hero-link secondary">Games</a>
    </div>
    <div class="wasm-badge">
      <span></span> powered by WebAssembly
    </div>
  </section>

  <script>
    (function() {
      var stored = localStorage.getItem('theme');
      var dark = stored ? stored === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      var btn = document.getElementById('theme-toggle');
      btn.textContent = dark ? '☀️' : '🌙';
      btn.addEventListener('click', function() {
        var isDark = document.documentElement.dataset.theme === 'dark';
        document.documentElement.dataset.theme = isDark ? 'light' : 'dark';
        localStorage.setItem('theme', isDark ? 'light' : 'dark');
        btn.textContent = isDark ? '🌙' : '☀️';
      });
    })();
  </script>
</body>
</html>
